<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="440" viewBox="0 0 1500 440" font-family="monospace" fill="#172c44">
<title>Content Service data sets</title>
<desc>Keys and relationship columns from the pinned documentation snapshot. External tables have dashed borders.</desc>
<rect x="0" y="0" width="1500" height="440" fill="white"/>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 Z" fill="#405775"/></marker></defs>
<text x="40" y="34" font-size="20" font-weight="bold">Content Service data sets</text>
<text x="40" y="59" font-size="12">PK: primary key; FK: foreign key; >: outgoing join. Dashed boxes: external area.</text>
<path data-from-dataset="audio-video-processed" data-from-column="ContentId" data-to-dataset="media-objects" data-to-column="ContentId" data-join-kind="key" d="M 480 184 H 492 V 92 H 1008 V 184 H 1020" fill="none" stroke="#3974a5" stroke-width="1.3" marker-end="url(#arrow)"><title>audio-video-processed.ContentId to media-objects.ContentId (key)</title></path>

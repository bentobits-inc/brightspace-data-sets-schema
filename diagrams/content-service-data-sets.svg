<path data-from-dataset="media-consumption-log" data-from-column="UserId" data-to-dataset="users" data-to-column="UserId" data-join-kind="key" d="M 970 202 H 988 V 86 H 22 V 354 H 40" fill="none" stroke="#3974a5" stroke-width="1.3" marker-end="url(#arrow)"><title>media-consumption-log.UserId to users.UserId (key)</title></path>
